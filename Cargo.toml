[package]
name = "teensy4-embassy-example"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
teensy4-bsp = { version = "0.5", features = ["rt"] }
teensy4-panic = "0.2"

# Embassy runtime and timekeeping (no defmt feature)
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-time = { version = "0.4", features = ["tick-hz-1_000_000"] }
# Warteschlange für die Weckzeiten aller Tasks (siehe src/time_driver.rs)
embassy-time-queue-utils = { version = "0.1", features = ["generic-queue-8"] }
embassy-time-driver = { version = "0.2", features = ["tick-hz-1_000_000"] }
critical-section = "1.1"
static_cell = "2.1"


